[project]
name = "laya-decision-demo"
version = "0.3.0"
description = "The private Laya inference worker for the Go and Svelte playground"
requires-python = ">=3.12,<3.14"
dependencies = [
    "laya==0.3.20",
    "torch==2.8.0",
    "transformers==4.57.6",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
